<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1: iOS zoomt sonst beim Antippen jedes Felds unter 16 px hinein und bleibt
         vergrößert; Zoomen mit zwei Fingern erlaubt iOS trotzdem. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Xenia</title>

    <!-- PWA / standalone app (Add-to-Home-Screen) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7B9FCC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Xenia" />
    <link rel="apple-touch-icon" href="/icon-512.svg" />

    <!-- Fonts: DM Sans (body) + JetBrains Mono (numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Reset & base */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body, #root {
        height: 100%;
        width: 100%;
        overscroll-behavior-y: none; /* no pull-to-refresh / overscroll bounce */
      }

      /* Farben aus dem Farbschema (theme.ts applyTheme setzt die Variablen,
         color-scheme steuert Scrollbalken, Auswahllisten und Zahlenfelder des
         Browsers). Die Werte hier sind die von „Dunkel“ — bis das Skript läuft. */
      :root {
        --bg: #0B0D11;
        --txt: #E2E4EA;
        --scroll: #2C3444;
        --scroll-hover: #3A4055;
      }
      html {
        color-scheme: dark;
        scrollbar-width: thin;                    /* Firefox — inherits downwards */
        scrollbar-color: var(--scroll) transparent;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--scroll);
        border-radius: 999px;
        /* padding-box keeps the thumb inset on any panel background */
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); background-clip: padding-box; }
      ::-webkit-scrollbar-corner { background: transparent; }

      /* Zahlenfelder app-weit ohne Spinner: die Pfeile reservieren Breite und
         zerreissen jede kompakte Inline-Zeile (Limiter, Exit-Chips). */
      input[type=number]::-webkit-outer-spin-button,
      input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      input[type=number] { -moz-appearance: textfield; appearance: textfield; }

      /* Dashboard am Handy quer: zu wenig Hoehe, als dass der Chart nur den Rest
         bekommen koennte. Dann scrollt die Seite und der Chart fuellt die
         sichtbare Hoehe unter Temperaturen und Favoriten (Dashboard.tsx). */
      @media (orientation: landscape) and (max-height: 499px) {
        .dash-root { height: auto !important; min-height: 100%; }
        .dash-chart { flex: 0 0 auto !important; height: max(220px, calc(100dvh - 180px)); }
      }
      /* Handy hoch: steht ein Stufenziel in der Kopfzeile, fällt der Profilname weg. */
      @media (orientation: portrait) and (max-width: 499px) {
        .chart-title-name { display: none; }
      }

      body {
        background-color: var(--bg);
        color: var(--txt);
        font-family: 'DM Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
